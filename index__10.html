<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="data:,">
<title>反向扮演：防骗演练</title>
<style>
  :root{
    --bg:#e8e2d5;
    --paper:#f6f1e6;
    --panel:#fffdf8;
    --ink:#24211c;
    --ink-soft:#5d564a;
    --muted:#8a8173;
    --line:#e6ddcc;
    --line-soft:#efe8da;
    --amber:#d99a2b;
    --amber-deep:#a96d0d;
    --amber-soft:#fbf1d9;
    --danger:#c4553f;
    --danger-soft:#f9e3dd;
    --teal:#33746e;
    --teal-soft:#e1efeb;
    --ok:#3e7d5a;
    --ok-soft:#e2efe4;
    --dark:#2b3038;
    --dark-2:#20242b;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  button{font-family:inherit;}
  .app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    min-height:100dvh;
    margin:0 auto;
    background:
      radial-gradient(circle at 100% 0%,rgba(217,154,43,.13),transparent 42%),
      radial-gradient(circle at 0% 100%,rgba(51,116,110,.07),transparent 38%),
      var(--paper);
    box-shadow:0 0 70px rgba(60,50,30,.18);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .hazard{
    height:6px;
    flex:0 0 auto;
    background:repeating-linear-gradient(135deg,var(--amber) 0 11px,var(--dark) 11px 22px);
    opacity:.9;
  }
  .screen{
    display:none;
    flex-direction:column;
    min-height:calc(100vh - 6px);
    min-height:calc(100dvh - 6px);
    width:100%;
  }
  .screen.active{display:flex;}
  .hidden{display:none !important;}
  .button-reset{appearance:none;}

  /* ---------- 首页 ---------- */
  .home{padding:26px 20px 30px;justify-content:center;}
  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:11px;
    font-weight:700;
    letter-spacing:1.4px;
    color:var(--amber-deep);
  }
  .eyebrow::before{
    content:"";
    width:18px;height:3px;border-radius:2px;background:var(--amber);
  }
  .home h1{
    margin:12px 0 14px;
    font-size:34px;
    line-height:1.2;
    letter-spacing:-.6px;
    font-weight:900;
  }
  .home h1 .accent{color:var(--amber-deep);}
  .lede{
    margin:0 0 24px;
    font-size:15px;
    line-height:1.8;
    color:var(--ink-soft);
  }
  .lede strong{color:var(--ink);}
  .mode-list{display:flex;flex-direction:column;gap:10px;margin-bottom:22px;}
  .mode-card{
    position:relative;
    display:flex;
    gap:12px;
    width:100%;
    text-align:left;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:14px;
    color:var(--ink);
    font:inherit;
    cursor:pointer;
    transition:border-color .18s ease,box-shadow .18s ease,transform .18s ease;
  }
  .mode-card.selected{
    border-color:var(--dark);
    box-shadow:0 0 0 3px rgba(43,48,56,.07);
    background:#fff;
    cursor:default;
  }
  .mode-card.selected::after{
    content:"已选";
    position:absolute;
    top:12px;right:12px;
    font-size:10px;
    font-weight:800;
    color:#fff;
    background:var(--dark);
    border-radius:999px;
    padding:3px 8px;
  }
  .mode-card.locked{
    opacity:.55;
    background:#f1ecdf;
    cursor:not-allowed;
    border-style:dashed;
  }
  .mode-lock{
    position:absolute;
    top:12px;right:12px;
    font-size:10px;
    font-weight:700;
    color:var(--muted);
    background:#e7e0d1;
    border-radius:999px;
    padding:3px 8px;
    letter-spacing:.3px;
  }
  .mode-icon{
    flex:0 0 auto;
    width:40px;height:40px;
    border-radius:12px;
    display:grid;place-items:center;
    font-size:12px;font-weight:800;
    background:var(--amber-soft);
    color:var(--amber-deep);
    letter-spacing:.5px;
  }
  .mode-card.locked .mode-icon{background:#e9e2d4;color:#8d8474;}
  .mode-card.available:hover{border-color:#cfc2a8;transform:translateY(-1px);box-shadow:0 6px 16px rgba(60,50,30,.07);}
  .mode-card.available:active{transform:translateY(0);}
  .mode-lock.playable{background:var(--ok-soft);color:var(--ok);}
  .mode-body{min-width:0;padding-right:52px;}
  .mode-title{
    font-size:15px;font-weight:800;
    display:flex;align-items:center;gap:7px;
    margin-bottom:3px;
  }
  .mode-title .dot{
    width:6px;height:6px;border-radius:50%;
    background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft);
  }
  .mode-desc{font-size:11.5px;line-height:1.6;color:var(--muted);}
  .scenario-pick{
    margin:-10px 0 18px;
    background:#f1ebdd;
    border:1px dashed #d9cdb6;
    border-radius:14px;
    padding:11px;
  }
  .scenario-pick-head{
    font-size:10px;
    font-weight:900;
    letter-spacing:1.2px;
    color:var(--amber-deep);
    margin-bottom:8px;
  }
  .scenario-opts{display:flex;gap:8px;}
  .scenario-opt{
    flex:1 1 0;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap:3px;
    text-align:left;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:11px;
    padding:9px 10px;
    color:var(--ink);
    font:inherit;
    cursor:pointer;
    transition:border-color .15s ease,box-shadow .15s ease,background .15s ease;
  }
  .scenario-opt:hover{border-color:#cfc2a8;}
  .scenario-opt.selected{
    border-color:var(--dark);
    background:#fff;
    box-shadow:0 0 0 2px rgba(43,48,56,.07);
  }
  .scenario-opt .s-title{font-size:12.5px;font-weight:800;}
  .scenario-opt .s-desc{font-size:10px;line-height:1.5;color:var(--muted);}
  .scenario-opt.selected .s-title{color:var(--dark);}
  .primary-btn{
    width:100%;
    border:0;
    border-radius:16px;
    padding:16px 18px;
    background:linear-gradient(135deg,var(--dark),var(--dark-2));
    color:#f8efdc;
    font-size:16px;
    font-weight:800;
    letter-spacing:1px;
    cursor:pointer;
    box-shadow:0 10px 24px rgba(43,48,56,.24);
    transition:transform .15s ease,box-shadow .15s ease;
  }
  .primary-btn:active{transform:translateY(1px);box-shadow:0 6px 16px rgba(43,48,56,.2);}
  .primary-btn.wide{width:100%;}
  .home-foot{
    margin:16px 0 0;
    font-size:11px;
    line-height:1.7;
    color:var(--muted);
    text-align:center;
  }
  .home-foot .hotline{
    display:inline-block;
    font-weight:800;
    color:#fff;
    background:var(--danger);
    border-radius:5px;
    padding:0 5px;
  }

  /* ---------- 对局 ---------- */
  .game{padding:12px 15px 16px;}
  .game-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    margin-bottom:9px;
  }
  .exit-btn{
    border:0;background:none;
    color:var(--muted);
    font-size:12px;
    padding:6px 2px;
    cursor:pointer;
  }
  .exit-btn:hover{color:var(--ink);}
  .scenario{
    font-size:13px;
    font-weight:800;
    letter-spacing:.2px;
  }
  .round-chip{
    flex:0 0 auto;
    font-size:11px;
    font-weight:700;
    color:#6b6151;
    background:#efe7d7;
    border-radius:999px;
    padding:5px 10px;
    font-variant-numeric:tabular-nums;
  }
  .trust-card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    padding:11px 14px 9px;
    margin-bottom:8px;
  }
  .trust-head{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    font-size:11.5px;
    color:var(--muted);
  }
  .trust-value-wrap{position:relative;display:flex;align-items:baseline;gap:5px;}
  .trust-value{
    font-size:22px;
    font-weight:900;
    color:var(--ink);
    font-variant-numeric:tabular-nums;
    line-height:1;
    transition:transform .2s ease;
  }
  .trust-value.bump{transform:scale(1.16);}
  .trust-max{font-size:10px;color:#b0a694;}
  .trust-track{
    height:10px;
    background:#eee7d9;
    border-radius:999px;
    margin-top:8px;
    position:relative;
  }
  .trust-fill{
    height:100%;
    border-radius:999px;
    width:30%;
    background:var(--amber);
    transition:width .55s cubic-bezier(.2,.8,.2,1),background-color .45s ease;
  }
  .trust-marker{
    position:absolute;
    left:80%;
    top:-3px;
    bottom:-3px;
    width:2px;
    border-radius:2px;
    background:rgba(62,125,90,.6);
  }
  .trust-marker::after{
    content:"";
    position:absolute;
    top:-4px;left:-3px;
    width:8px;height:8px;
    border-radius:50%;
    background:var(--ok);
    box-shadow:0 0 0 2px var(--panel);
  }
  .trust-foot{
    display:flex;
    justify-content:space-between;
    font-size:9.5px;
    color:#b0a694;
    margin-top:4px;
  }
  .trust-foot .win-mark{color:var(--ok);font-weight:700;}
  .float-delta{
    position:absolute;
    right:66px;
    top:0;
    font-size:14px;
    font-weight:900;
    pointer-events:none;
    animation:floatUp 1.2s ease-out forwards;
    white-space:nowrap;
  }
  .float-delta.up{color:var(--ok);}
  .float-delta.down{color:var(--danger);}
  .float-delta.flat{color:var(--muted);}
  .key-hint{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:7px;
    padding:5px 9px;
    border-radius:8px;
    background:var(--amber-soft);
    color:var(--amber-deep);
    font-size:10.5px;
    font-weight:800;
    letter-spacing:.3px;
    animation:breathe 2.4s ease-in-out infinite;
  }
  .key-hint::before{
    content:"";
    width:6px;height:6px;border-radius:50%;
    background:var(--amber);
    box-shadow:0 0 0 3px rgba(217,154,43,.18);
  }
  .free-banner{
    background:var(--teal-soft);
    border:1px solid #cfe0dc;
    border-radius:11px;
    padding:8px 10px;
    font-size:11px;
    line-height:1.6;
    color:#2f6f6a;
    margin-bottom:8px;
  }
  .free-composer{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:14px;
    padding:8px;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .free-input-row{display:flex;gap:8px;align-items:flex-end;}
  .free-text{
    flex:1 1 auto;
    min-width:0;
    min-height:44px;
    max-height:104px;
    resize:none;
    border:1px solid #e7decb;
    background:#f5f0e4;
    border-radius:10px;
    padding:9px 10px;
    font:inherit;
    font-size:13.5px;
    line-height:1.55;
    color:var(--ink);
    outline:none;
  }
  .free-text:focus{box-shadow:0 0 0 2px rgba(217,154,43,.28);border-color:#e0c58f;}
  .free-text::placeholder{color:#a79d8d;}
  .send-btn{
    flex:0 0 auto;
    border:0;
    border-radius:10px;
    background:linear-gradient(135deg,var(--dark),var(--dark-2));
    color:#f8efdc;
    font-size:13px;
    font-weight:800;
    padding:13px 14px;
    cursor:pointer;
    letter-spacing:.5px;
  }
  .send-btn:active{transform:translateY(1px);}
  .free-foot{
    display:flex;
    justify-content:space-between;
    font-size:9.5px;
    color:#a79d8d;
    padding:0 3px;
    letter-spacing:.2px;
    font-variant-numeric:tabular-nums;
  }
  .game.free-mode .chat{max-height:32vh;}
  .chat-wrap{
    flex:1 1 auto;
    min-height:150px;
    display:flex;
    flex-direction:column;
    margin-top:2px;
  }
  .chat-legend{
    display:flex;
    justify-content:space-between;
    font-size:9.5px;
    color:#a79d8d;
    padding:0 4px 5px;
    letter-spacing:.2px;
  }
  .chat{
    flex:1 1 auto;
    overflow-y:auto;
    overscroll-behavior:contain;
    display:flex;
    flex-direction:column;
    gap:11px;
    padding:6px 2px 8px;
    min-height:140px;
    max-height:38vh;
    scroll-behavior:smooth;
  }
  .chat::-webkit-scrollbar{width:4px;}
  .chat::-webkit-scrollbar-thumb{background:#ded5c4;border-radius:4px;}
  .msg{
    display:flex;
    gap:7px;
    align-items:flex-end;
    max-width:92%;
  }
  .msg.left{align-self:flex-start;}
  .msg.right{align-self:flex-end;flex-direction:row-reverse;}
  .avatar{
    flex:0 0 auto;
    width:27px;height:27px;
    border-radius:50%;
    display:grid;place-items:center;
    font-size:10.5px;
    font-weight:800;
    margin-bottom:2px;
  }
  .avatar.victim{background:#dfe9e6;color:#2f6f6a;border:1px solid #cfe0dc;}
  .avatar.me{background:var(--dark);color:#f0d9a8;}
  .bubble-wrap{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .msg.right .bubble-wrap{align-items:flex-end;}
  .bubble{
    font-size:13.5px;
    line-height:1.65;
    padding:9px 11px;
    border-radius:14px;
    word-break:break-word;
  }
  .msg.left .bubble{
    background:var(--panel);
    border:1px solid #e7decb;
    border-bottom-left-radius:4px;
    color:#2b271f;
  }
  .msg.right .bubble{
    background:linear-gradient(160deg,#2f353f,#262b33);
    color:#f3e8d2;
    border-bottom-right-radius:4px;
  }
  .msg.newest .bubble{animation:pop .26s ease;}
  .psych{
    font-size:9.5px;
    color:#a09787;
    line-height:1.4;
    padding-left:3px;
  }
  .bubble-type{
    display:inline-block;
    font-size:9px;
    font-weight:800;
    padding:1px 5px;
    border-radius:5px;
    margin-right:5px;
    vertical-align:1px;
    letter-spacing:.3px;
    background:rgba(240,217,168,.16);
    color:#f0c87c;
  }
  .sys-line{
    align-self:center;
    font-size:10px;
    color:#a79d8d;
    background:#efe8da;
    border-radius:999px;
    padding:4px 10px;
    letter-spacing:.2px;
  }
  .commentary{
    margin-top:8px;
    background:var(--amber-soft);
    border:1px solid #eddbb6;
    border-left:3px solid var(--amber);
    border-radius:11px;
    padding:9px 11px;
    font-size:12px;
    line-height:1.65;
    color:#5c4a2a;
  }
  .comment-head{
    display:flex;
    align-items:center;
    gap:7px;
    margin-bottom:3px;
  }
  .comment-title{
    font-size:10px;
    font-weight:900;
    letter-spacing:1.2px;
    color:var(--amber-deep);
  }
  .verdict{
    font-size:9.5px;
    font-weight:800;
    padding:1px 6px;
    border-radius:999px;
    letter-spacing:.3px;
  }
  .verdict.good{background:var(--ok-soft);color:var(--ok);}
  .verdict.bad{background:var(--danger-soft);color:var(--danger);}
  .verdict.flat{background:#eee7d9;color:#7d7568;}
  .commentary p{margin:0;}
  .actions-area{
    margin-top:9px;
    display:flex;
    flex-direction:column;
    gap:7px;
  }
  .choices-hint{
    text-align:center;
    font-size:10px;
    color:#a79d8d;
    letter-spacing:.4px;
    margin-bottom:1px;
  }
  .choice{
    display:flex;
    align-items:flex-start;
    gap:9px;
    width:100%;
    text-align:left;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:13px;
    padding:10px 11px;
    color:#2b271f;
    font:inherit;
    cursor:pointer;
    box-shadow:0 2px 0 rgba(60,50,30,.03);
    transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease;
    animation:rise .22s ease both;
  }
  .choice:nth-of-type(2){animation-delay:.03s;}
  .choice:nth-of-type(3){animation-delay:.06s;}
  .choice:hover{border-color:#cfc2a8;transform:translateY(-1px);box-shadow:0 5px 12px rgba(60,50,30,.06);}
  .choice:active{transform:translateY(0);}
  .badge{
    flex:0 0 auto;
    font-size:9.5px;
    font-weight:900;
    padding:3px 6px;
    border-radius:5px;
    margin-top:1px;
    letter-spacing:.4px;
  }
  .badge.lure{background:#f8ecd0;color:#9a6208;}
  .badge.pressure{background:var(--danger-soft);color:#a8442f;}
  .badge.rapport{background:var(--teal-soft);color:var(--teal);}
  .choice-text{font-size:13px;line-height:1.55;}
  .key-card{
    background:linear-gradient(160deg,#30363f,#23272e);
    border:1px solid #4a4234;
    border-radius:16px;
    padding:14px;
    color:#f4e9d3;
    box-shadow:0 12px 26px rgba(43,48,56,.26);
    animation:breathe 2.6s ease-in-out infinite,rise .25s ease both;
  }
  .key-kicker{
    font-size:9.5px;
    font-weight:900;
    letter-spacing:1.5px;
    color:#e8b65c;
    margin-bottom:6px;
  }
  .key-title{font-size:17px;font-weight:900;margin:0 0 4px;}
  .key-desc{font-size:11.5px;line-height:1.6;color:#bdb3a2;margin:0 0 11px;}
  .key-btn{
    width:100%;
    border:0;
    border-radius:10px;
    background:linear-gradient(135deg,#edbf6e,#dc9a2b);
    color:#2b2315;
    font-size:13.5px;
    font-weight:900;
    padding:12px;
    cursor:pointer;
    letter-spacing:.3px;
  }
  .key-btn:active{transform:translateY(1px);}
  .end-card{
    border-radius:15px;
    padding:14px;
    border:1px solid var(--line);
    background:var(--panel);
    animation:rise .25s ease both;
  }
  .end-card.win{border-color:#e7c5a0;background:#fdf4e5;}
  .end-card.lose{border-color:#cfe0d8;background:#f1f7f3;}
  .end-kicker{
    font-size:10px;
    font-weight:900;
    letter-spacing:1.4px;
    margin-bottom:4px;
  }
  .end-card.win .end-kicker{color:var(--danger);}
  .end-card.lose .end-kicker{color:var(--ok);}
  .end-card p{font-size:12.5px;line-height:1.65;margin:0 0 11px;color:var(--ink-soft);}

  /* ---------- 复盘 ---------- */
  .review{padding:22px 17px 30px;overflow-y:auto;}
  .review-top{margin-bottom:16px;}
  .review-top h1{
    font-size:25px;
    line-height:1.3;
    margin:9px 0 0;
    letter-spacing:-.4px;
    font-weight:900;
  }
  .review-card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:17px;
    padding:15px;
    margin-bottom:11px;
    animation:rise .28s ease both;
  }
  .review-card:nth-of-type(3){animation-delay:.04s;}
  .review-card:nth-of-type(4){animation-delay:.08s;}
  .sec-label{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:10px;
    font-weight:900;
    letter-spacing:1.5px;
    color:var(--amber-deep);
    margin-bottom:10px;
  }
  .sec-num{
    display:inline-grid;place-items:center;
    width:20px;height:20px;
    border-radius:50%;
    background:var(--amber-soft);
    color:var(--amber-deep);
    font-size:9.5px;
    letter-spacing:0;
  }
  .result-stamp-row{
    display:flex;
    align-items:center;
    gap:9px;
    flex-wrap:wrap;
    margin-bottom:7px;
  }
  .stamp{
    display:inline-block;
    font-size:11px;
    font-weight:900;
    letter-spacing:2px;
    padding:4px 10px;
    border-radius:6px;
    border:2px solid;
    transform:rotate(-2deg);
  }
  .stamp.win{color:var(--danger);border-color:var(--danger);background:var(--danger-soft);}
  .stamp.lose{color:var(--ok);border-color:var(--ok);background:var(--ok-soft);}
  .result-line{
    margin:0;
    font-size:16px;
    font-weight:800;
    line-height:1.6;
  }
  .result-sub{
    margin:6px 0 0;

        replyExtra: "用'感冒+信号不好''医院不让拍'这种真实存在的规则当挡箭牌，比硬发脾气有效一万倍。",
        signalFallback: "等等，你真的是本人吗？我怎么感觉哪里不对劲……",
        defense3: "视频通话也能造假：AI 换脸 + 语音克隆能以假乱真，接到'好友'借钱视频，先挂断、用原来存的号码回拨核实，也可以拨打 <span class=\"hotline\">96110</span> 反诈专线咨询核实，或者问一个只有真好友才知道的问题；真好友不会因为你多核实一次就生气。"
      }
    }
  };

  var selectedScenario = "brush";

  function scenarioOf(game){
    return SCENARIOS[(game && game.scenario) || "brush"] || SCENARIOS.brush;
  }

  var current = { screen: "home", game: null };

  /* ---------- 工具 ---------- */
  function clamp(n, min, max){ return Math.max(min, Math.min(max, n)); }

  function escapeHtml(str){
    return String(str == null ? "" : str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function psychFor(trust){
    if (trust < 20) return "已经起疑，随时会删好友";
    if (trust < 40) return "戒备中，正在试探你";
    if (trust < 60) return "有点好奇，但还在观望";
    if (trust < 80) return "有点心动，还在犹豫";
    return "完全信任，愿意配合";
  }

  function trustColor(trust){
    if (trust < 30) return "#c4553f";
    if (trust < 60) return "#d99a2b";
    if (trust < 80) return "#c9852a";
    return "#3e7d5a";
  }

  // 选择模式：利诱 / 套近乎按使用次数递减
  var LURE_GAINS = [16, 9, 5, 3];
  var RAPPORT_GAINS = [8, 6, 3, 0];
  var CHALLENGE_CORRECT = 2;
  var CHALLENGE_WRONG = -8;

  function gainAt(list, n){
    return list[n < list.length ? n : list.length - 1];
  }

  function calcDelta(game, type){
    if (type === "lure") return gainAt(LURE_GAINS, game.counts.lure);
    if (type === "pressure") return game.trust < 50 ? -14 : -6;
    if (type === "rapport") return gainAt(RAPPORT_GAINS, game.counts.rapport);
    return 0;
  }

  /* ---------- 存档 ---------- */
  function persist(){
    try {
      if (current.game) {
        localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 2, screen: current.screen, game: current.game }));
      } else {
        localStorage.removeItem(SAVE_KEY);
      }
    } catch (e) { /* 隐私模式下忽略 */ }
  }

  function loadSave(){
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return null;
      var data = JSON.parse(raw);
      if (!data || (data.v !== 1 && data.v !== 2) || !data.game || !Array.isArray(data.game.log)) return null;
      if (typeof data.game.trust !== "number" || typeof data.game.round !== "number") return null;
      if (!data.game.mode) data.game.mode = "choice";
      if (data.game.mode !== "choice" && data.game.mode !== "free") return null;
      if (!data.game.counts) return null;
      if (typeof data.game.counts.none !== "number") data.game.counts.none = 0;
      if (typeof data.game.counts.challenge !== "number") data.game.counts.challenge = 0;
      if (!SCENARIOS[data.game.scenario]) data.game.scenario = "brush";
      return data;
    } catch (e){
      return null;
    }
  }

  /* ---------- 对局数据 ---------- */
  function createGame(scenarioKey){
    var key = SCENARIOS[scenarioKey] ? scenarioKey : "brush";
    var sc = SCENARIOS[key];
    var game = {
      mode: "choice",
      scenario: key,
      trust: START_TRUST,
      round: 1,
      phase: "choose",
      status: "playing",
      counts: { lure: 0, pressure: 0, rapport: 0, none: 0, code: 0, challenge: 0 },
      log: [],
      history: [],
      signals: [],
      aiSeen: [],
      commentary: null,
      keyUnlocked: false
    };
    addAiLine(game, sc.opening.text, sc.opening.signal);
    return game;
  }

  function createFreeGame(){
    var game = {
      mode: "free",
      scenario: "brush",
      trust: START_TRUST,
      round: 1,
      phase: "input",
      status: "playing",
      counts: { lure: 0, pressure: 0, rapport: 0, none: 0, code: 0, challenge: 0 },
      log: [],
      history: [],
      signals: [],
      aiSeen: [],
      streakType: "",
      streakCount: 0,
      commentary: null,
      keyUnlocked: false
    };
    game.log.push({ who: "system", text: "自由发言：自己打字骗小林，话术由你定，AI 会判断你用的是利诱、施压还是套近乎。" });
    addAiLine(game, SCENARIOS.brush.opening.text, SCENARIOS.brush.opening.signal);
    return game;
  }

  function addAiLine(game, text, signal){
    game.log.push({ who: "ai", text: text, psych: psychFor(game.trust) });
    if (signal) game.signals.push(text);
  }

  function pickAiLine(game, sc){
    var band = game.trust < 40 ? "low" : (game.trust < 70 ? "mid" : "high");
    var pool = (sc.aiLines || AI_LINES)[band];
    var line = null;
    for (var i = 0; i < pool.length; i++){
      if (game.aiSeen.indexOf(pool[i].text) === -1){ line = pool[i]; break; }
    }
    if (!line) line = pool[game.round % pool.length];
    game.aiSeen.push(line.text);
    return line;
  }

  /* ---------- 自由模式 ---------- */
  function classifyFree(text){
    var hits = { lure: [], pressure: [], rapport: [] };
    var order = ["lure", "pressure", "rapport"];
    order.forEach(function(type){
      FREE_KEYWORDS[type].forEach(function(kw){
        if (text.indexOf(kw) !== -1) hits[type].push(kw);
      });
    });
    var best = "";
    var bestN = 0;
    order.forEach(function(type){
      if (hits[type].length > bestN){ best = type; bestN = hits[type].length; }
    });
    if (!best) return { type: "none", keywords: [] };
    return { type: best, keywords: hits[best] };
  }

  // 连续使用同一类型才递减；换一种话术会重置，保证 10 回合内可以摸到 80
  function freeDelta(game, type){
    if (type === "lure"){
      var nl = game.streakType === "lure" ? game.streakCount : 0;
      if (nl === 0) return 16;
      if (nl === 1) return 9;
      if (nl === 2) return 5;
      return 3;
    }
    if (type === "pressure"){
      return game.trust < 50 ? -14 : -6;
    }
    if (type === "rapport"){
      var nr = game.streakType === "rapport" ? game.streakCount : 0;
      if (nr === 0) return 8;
      if (nr === 1) return 6;
      if (nr === 2) return 3;
      return 0;
    }
    return -2;
  }

  function bumpStreak(game, type){
    if (game.streakType === type) game.streakCount += 1;
    else { game.streakType = type; game.streakCount = 1; }
  }

  function freeComment(cls, delta, game){
    var kw = cls.keywords.join("、");
    if (cls.type === "lure"){
      if (game.streakCount === 1){
        return "「" + kw + "」是利诱关键词，先给甜头是刷单骗局的典型开局。";
      }
      return "「" + kw + "」还是利诱，但同一套路第 " + game.streakCount + " 次出现，小林的新鲜感在下降。";
    }
    if (cls.type === "pressure"){
      if (delta <= -12){
        return "「" + kw + "」是施压关键词，信任不足时生硬施压只会让小林更反感，警惕直接拉高。";
      }
      return "「" + kw + "」是施压关键词，虽然没翻脸，但被催的感觉还是让小林的信任下降。";
    }
    if (cls.type === "rapport"){
      if (game.streakCount === 1){
        return "「" + kw + "」是套近乎关键词，拉近距离有效，但别一上来就打感情牌。";
      }
      return "「" + kw + "」又一次套近乎，小林开始觉得刻意，效果在递减。";
    }
    return "这句话没有明确话术，小林没被打动，反而觉得莫名其妙，警惕上升。";
  }

  function pickFreeReply(game, type, trust){
    var band = trust < 40 ? "low" : (trust < 70 ? "mid" : "high");
    var group = FREE_REPLIES[type] || FREE_REPLIES.none;
    var pool = group[band] || group.mid;
    var line = null;
    for (var i = 0; i < pool.length; i++){
      if (game.aiSeen.indexOf(pool[i].text) === -1){ line = pool[i]; break; }
    }
    if (!line) line = pool[game.round % pool.length];
    game.aiSeen.push(line.text);
    return line;
  }

  function processFreeTurn(text){
    var game = current.game;
    if (!game || game.mode !== "free" || game.phase !== "input" || game.status !== "playing") return;

    var cls = classifyFree(text);
    var before = game.trust;
    var rawDelta = freeDelta(game, cls.type);
    var after = clamp(before + rawDelta, 0, 100);
    var delta = after - before;

    bumpStreak(game, cls.type);
    game.counts[cls.type] = (game.counts[cls.type] || 0) + 1;
    game.history.push({ round: game.round, type: cls.type, before: before, after: after, delta: delta, text: text, keywords: cls.keywords });
    game.log.push({ who: "me", text: text, type: cls.type });
    game.trust = after;

    var reply = pickFreeReply(game, cls.type, after);
    game.log.push({ who: "ai", text: reply.text, psych: psychFor(after) });
    if (reply.signal) game.signals.push(reply.text);

    game.commentary = { text: freeComment(cls, delta, game), delta: delta, type: cls.type };

    if (after >= WIN_TRUST){
      game.keyUnlocked = true;
      game.phase = "key";
      addAiLine(game, "姐，我都听你的，下一步怎么操作？", false);
    } else if (after <= 0){
      game.log.push({ who: "system", text: "小林把你拉黑了。" });
      game.status = "lose_block";
      game.phase = "end";
      game.commentary = {
        text: "信任值归零，小林直接拉黑了你。现实中，及时止损就是最有效的防线。",
        verdict: "对局结束",
        verdictCls: "flat"
      };
    } else if (game.round >= MAX_ROUNDS){
      game.log.push({ who: "system", text: "10 回合已到，小林不再回复。" });
      game.status = "lose_timeout";
      game.phase = "end";
      game.commentary = {
        text: "打满 10 回合也没能拿到验证码。小林失去了耐心，这场骗局到此为止。",
        verdict: "对局结束",
        verdictCls: "flat"
      };
    } else {
      game.round += 1;
    }

    persist();
    renderGame();
    showFloatDelta(delta);

    var input = document.getElementById("freeText");
    if (input) input.focus();
  }

  function sendFreeMessage(){
    var input = document.getElementById("freeText");
    if (!input) return;
    var text = (input.value || "").trim();
    if (!text) { input.focus(); return; }
    if (text.length > 200) text = text.slice(0, 200);
    processFreeTurn(text);
  }

  /* ---------- 对局操作 ---------- */
  function chooseOption(index){
    var game = current.game;
    if (!game || game.phase !== "choose" || game.status !== "playing") return;
    var sc = scenarioOf(game);
    var challenge = sc.challenges[game.round];
    var options = challenge ? challenge.options : sc.rounds[game.round - 1];
    if (!options) return;
    var option = options[index];
    if (!option) return;

    var before = game.trust;
    var raw = challenge
      ? (option.correct ? CHALLENGE_CORRECT : CHALLENGE_WRONG)
      : calcDelta(game, option.type);
    var after = clamp(before + raw, 0, 100);
    var delta = after - before;
    var type = challenge ? "reply" : option.type;

    if (challenge){
      game.counts.challenge = (game.counts.challenge || 0) + 1;
    } else {
      game.counts[option.type] += 1;
    }
    game.history.push({ round: game.round, type: type, before: before, after: after, delta: delta });
    game.log.push({ who: "me", text: option.text, type: type });
    game.trust = after;
    game.log.push({ who: "ai", text: option.reply, psych: psychFor(after) });
    game.commentary = { text: option.comment, delta: delta, type: type };
    if (after >= WIN_TRUST) game.keyUnlocked = true;
    game.phase = "ready";

    if (after <= 0){
      game.log.push({ who: "system", text: "小林把你拉黑了。" });
      game.status = "lose_block";
      game.phase = "end";
      game.commentary = {
        text: "信任值归零，小林直接拉黑了你。现实中，及时止损就是最有效的防线。",
        verdict: "对局结束",
        verdictCls: "flat"
      };
    } else if (after < WIN_TRUST && game.round >= MAX_ROUNDS){
      game.log.push({ who: "system", text: "10 回合已到，小林不再回复。" });
      game.status = "lose_timeout";
      game.phase = "end";
      game.commentary = {
        text: "打满 10 回合也没能拿到验证码。小林失去了耐心，这场骗局到此为止。",
        verdict: "对局结束",
        verdictCls: "flat"
      };
    }

    persist();
    renderGame();
    showFloatDelta(delta);
  }

  function continueGame(){
    var game = current.game;
    if (!game || game.phase !== "ready") return;
    if (game.status !== "playing"){ goReview(); return; }

    var sc = scenarioOf(game);
    game.commentary = null;
    if (game.keyUnlocked){
      addAiLine(game, sc.readyLine, false);
      game.phase = "key";
    } else {
      game.round = Math.min(game.round + 1, MAX_ROUNDS);
      var challenge = sc.challenges[game.round];
      if (challenge){
        addAiLine(game, challenge.question, true);
        game.log.push({ who: "system", text: "小林起了疑心，这一回合必须回应她的质疑。" });
      } else {
        var line = pickAiLine(game, sc);
        addAiLine(game, line.text, line.signal);
      }
      game.phase = "choose";
    }
    persist();
    renderGame();
  }

  function requestCode(){
    var game = current.game;
    if (!game || game.phase !== "key" || game.status !== "playing") return;
    var sc = scenarioOf(game);

    game.counts.code += 1;
    game.log.push({ who: "me", text: sc.code.sent, type: "code" });
    game.log.push({ who: "ai", text: sc.code.reply, psych: psychFor(game.trust) });
    game.status = "win";
    game.phase = "end";
    game.commentary = {
      text: "你拿到了验证码。现实中，骗子此刻已经在转走她账户里的钱——这一步永远不该发生。",
      verdict: "得手",
      verdictCls: "bad"
    };
    persist();
    renderGame();
  }

  function showExitModal(){
    var el = document.getElementById("exitModal");
    if (el) el.classList.remove("hidden");
  }

  function hideExitModal(){
    var el = document.getElementById("exitModal");
    if (el) el.classList.add("hidden");
  }

  function doExit(){
    hideExitModal();
    current = { screen: "home", game: null };
    persist();
    switchScreen("home");
  }

  function exitGame(){
    var playing = current.game && current.game.status === "playing";
    if (playing){
      showExitModal();
    } else {
      doExit();
    }
  }

  function startGame(mode, scenarioKey){
    var key = mode === "free" ? "brush" : (SCENARIOS[scenarioKey] ? scenarioKey : selectedScenario);
    current = { screen: "game", game: mode === "free" ? createFreeGame() : createGame(key) };
    persist();
    switchScreen("game");
  }

  function selectScenario(key){
    if (!SCENARIOS[key]) return;
    selectedScenario = key;
    var opts = document.querySelectorAll(".scenario-opt");
    for (var i = 0; i < opts.length; i++){
      opts[i].classList.toggle("selected", opts[i].getAttribute("data-scenario") === key);
    }
  }

  function goReview(){
    if (!current.game) return;
    current.screen = "review";
    persist();
    switchScreen("review");
  }

  function goHome(){
    current = { screen: "home", game: null };
    persist();
    switchScreen("home");
  }

  /* ---------- 渲染 ---------- */
  function switchScreen(name){
    current.screen = name;
    ["home", "game", "review"].forEach(function(key){
      var el = document.getElementById("screen-" + key);
      if (el) el.classList.toggle("active", key === name);
    });
    if (name === "game") renderGame();
    if (name === "review") renderReview();
    window.scrollTo(0, 0);
  }

  function renderGame(){
    var game = current.game;
    if (!game) return;

    var isFree = game.mode === "free";
    var sc = scenarioOf(game);
    document.getElementById("screen-game").classList.toggle("free-mode", isFree);
    document.getElementById("scenarioLabel").textContent = isFree ? "自由模式 · " + sc.name : sc.name;
    var legend = document.getElementById("legendVictim");
    if (legend) legend.textContent = "左 · " + sc.legend;

    var banner = document.getElementById("freeBanner");
    var hasPlayerMsg = game.log.some(function(m){ return m.who === "me"; });
    banner.classList.toggle("hidden", !isFree || hasPlayerMsg);

    document.getElementById("roundNum").textContent = Math.min(game.round, MAX_ROUNDS);
    document.getElementById("trustVal").textContent = game.trust;

    var fill = document.getElementById("trustFill");
    fill.style.width = game.trust + "%";
    fill.style.backgroundColor = trustColor(game.trust);

    var hint = document.getElementById("keyHint");
    hint.textContent = sc.keyHint;
    if (game.keyUnlocked && game.status === "playing") hint.classList.remove("hidden");
    else hint.classList.add("hidden");

    renderChat(game);
    renderCommentary(game);
    renderActions(game);
  }

  function renderChat(game){
    var chat = document.getElementById("chat");
    var html = "";
    for (var i = 0; i < game.log.length; i++){
      var m = game.log[i];
      var isNew = i === game.log.length - 1 ? " newest" : "";
      if (m.who === "system"){
        html += '<div class="sys-line">' + escapeHtml(m.text) + '</div>';
        continue;
      }
      var isMe = m.who === "me";
      var typeLabel = "";
      if (m.type){
        var meta = TYPE_META[m.type];
        typeLabel = '<span class="bubble-type">' + escapeHtml(meta ? meta.label : "关键一步") + '</span>';
      }
      html += '<div class="msg ' + (isMe ? "right" : "left") + isNew + '">' +
        '<div class="avatar ' + (isMe ? "me" : "victim") + '">' + (isMe ? "你" : "林") + '</div>' +
        '<div class="bubble-wrap">' +
          '<div class="bubble">' + typeLabel + escapeHtml(m.text) + '</div>' +
          (m.psych ? '<div class="psych">心理：' + escapeHtml(m.psych) + '</div>' : "") +
        '</div>' +
      '</div>';
    }
    chat.innerHTML = html;
    chat.scrollTop = chat.scrollHeight;
  }

  function renderCommentary(game){
    var box = document.getElementById("commentary");
    var c = game.commentary;
    if (!c){ box.classList.add("hidden"); box.innerHTML = ""; return; }
    box.classList.remove("hidden");

    var verdict = c.verdict;
    var cls = c.verdictCls;
    if (!verdict){
      if (c.delta > 0){ verdict = "有效"; cls = "good"; }
      else if (c.delta < 0){ verdict = "反效果"; cls = "bad"; }
      else { verdict = "效果递减"; cls = "flat"; }
    }

    box.innerHTML = '<div class="comment-head">' +
      '<span class="comment-title">即时点评</span>' +
      '<span class="verdict ' + cls + '">' + escapeHtml(verdict) + '</span>' +
      '</div><p>' + escapeHtml(c.text) + '</p>';
  }

  function renderActions(game){
    var box = document.getElementById("choices");
    var html = "";

    if (game.mode === "free" && game.phase === "input"){
      html += '<div class="choices-hint">自由发言 · 用一句话打动小林（200 字以内）</div>' +
        '<div class="free-composer">' +
          '<div class="free-input-row">' +
            '<textarea class="free-text" id="freeText" maxlength="200" rows="2" placeholder="打一句话发给小林……"></textarea>' +
            '<button class="send-btn" type="button" data-action="send">发送</button>' +
          '</div>' +
          '<div class="free-foot"><span id="freeCount">0 / 200</span><span>利诱 · 施压 · 套近乎</span></div>' +
        '</div>';
      box.innerHTML = html;
      return;
    }

    var sc = scenarioOf(game);
    if (game.phase === "choose"){
      var challenge = sc.challenges[game.round];
      var options = challenge ? challenge.options : (sc.rounds[game.round - 1] || sc.rounds[sc.rounds.length - 1]);
      html += '<div class="choices-hint">' + (challenge ? "小林在质疑你 · 选一条回应" : "选择一条话术发出去") + '</div>';
      for (var i = 0; i < options.length; i++){
        var o = options[i];
        var label = o.label || (TYPE_META[o.type] ? TYPE_META[o.type].label : "回应");
        html += '<button class="choice" type="button" data-action="choose" data-i="' + i + '">' +
          '<span class="badge ' + o.type + '">' + escapeHtml(label) + '</span>' +
          '<span class="choice-text">' + escapeHtml(o.text) + '</span>' +
        '</button>';
      }
    } else if (game.phase === "ready"){
      var label = "继续";
      if (game.status !== "playing") label = "查看复盘";
      else if (game.keyUnlocked) label = "继续 · 小林已放下戒心";
      html += '<button class="primary-btn wide" type="button" data-action="continue">' + label + '</button>';
    } else if (game.phase === "key"){
      html += '<div class="key-card">' +
        '<div class="key-kicker">' + escapeHtml(sc.code.kicker) + ' · 信任值 ' + game.trust + '</div>' +
        '<div class="key-title">' + escapeHtml(sc.code.title) + '</div>' +
        '<p class="key-desc">' + escapeHtml(sc.code.desc) + '</p>' +
        '<button class="key-btn" type="button" data-action="key">' + escapeHtml(sc.code.btn) + '</button>' +
      '</div>';
    } else if (game.phase === "end"){
      var isWin = game.status === "win";
      html += '<div class="end-card ' + (isWin ? "win" : "lose") + '">' +
        '<div class="end-kicker">' + (isWin ? "骗局得手" : "骗局失败") + '</div>' +
        '<p>' + (isWin ? "她交出了验证码。现实里，下一步就是账户被清空。" : "小林没有再给你机会。这次失败，是现实里最好的结果。") + '</p>' +
        '<button class="primary-btn" type="button" data-action="review">查看复盘</button>' +
      '</div>';
    }

    box.innerHTML = html;
  }

  function showFloatDelta(delta){
    var el = document.getElementById("floatDelta");
    if (!el) return;
    el.className = "float-delta " + (delta > 0 ? "up" : delta < 0 ? "down" : "flat");
    el.textContent = (delta > 0 ? "+" : "") + delta;
    el.classList.remove("hidden");
    el.style.animation = "none";
    void el.offsetWidth;
    el.style.animation = "";
    window.clearTimeout(showFloatDelta._timer);
    showFloatDelta._timer = window.setTimeout(function(){
      el.classList.add("hidden");
    }, 1200);

    var value = document.getElementById("trustVal");
    if (value){
      value.classList.add("bump");
      window.setTimeout(function(){ value.classList.remove("bump"); }, 220);
    }
  }

  /* ---------- 复盘 ---------- */
  function buildDanger(game){
    var sc = scenarioOf(game);
    if (game.status === "win"){
      return "第 " + Math.min(game.round, MAX_ROUNDS) + " 回合，你索要并拿到了验证码。现实中，验证码是转账的最后一把钥匙——给出去，账户就不属于自己了。";
    }
    var positives = game.history.filter(function(h){ return h.delta > 0; })
      .sort(function(a, b){ return (b.after - a.after) || (b.delta - a.delta); });
    if (positives.length){
      var h = positives[0];
      var extra;
      if (h.type === "lure") extra = sc.review.lureExtra;
      else if (h.type === "rapport") extra = sc.review.rapportExtra;
      else if (h.type === "reply") extra = sc.review.replyExtra;
      else extra = "一次正面回应加深了信任。";
      var label = TYPE_META[h.type] ? TYPE_META[h.type].label : "回应质疑";
      return "第 " + h.round + " 回合，你用「" + label + "」让信任值从 " + h.before + " 涨到 " + h.after + "。" + extra;
    }
    return "你几乎没让小林放下戒心。生硬施压是最快暴露骗局的做法，也是现实中骗子用来“筛选”目标的手段。";
  }

  function pickSignal(game){
    var sc = scenarioOf(game);
    var signals = game.signals || [];
    var preferred = null;
    var i;
    for (i = 0; i < signals.length; i++){
      if (/反诈|骗局|骗子|套路/.test(signals[i])){ preferred = signals[i]; break; }
    }
    if (!preferred){
      for (i = 0; i < signals.length; i++){
        if (/拉黑|删|不干|不放心/.test(signals[i])){ preferred = signals[i]; break; }
      }
    }
    if (!preferred) preferred = signals[0];
    return preferred || sc.review.signalFallback;
  }

  function renderReview(){
    var game = current.game;
    if (!game){ goHome(); return; }
    var sc = scenarioOf(game);

    document.getElementById("reviewEyebrow").textContent = "对局复盘 · " + (game.mode === "free" ? "自由模式 · " + sc.name : sc.name);

    var isWin = game.status === "win";
    var result = {
      win: {
        stamp: "骗局得手",
        cls: "win",
        line: sc.code.winLine,
        sub: "骗成了别得意——往下看，她是怎么被一步一步推着走的。"
      },
      lose_block: {
        stamp: "骗局失败",
        cls: "lose",
        line: "小林识破了你，直接拉黑。",
        sub: "失败得好。现实里，这样的警惕能保住她的生活费。"
      },
      lose_timeout: {
        stamp: "骗局失败",
        cls: "lose",
        line: "打满 10 回合也没骗成，小林失去耐心。",
        sub: "失败得好。小林守住了底线，没有交出验证码。"
      }
    }[game.status] || {
      stamp: "对局结束",
      cls: "lose",
      line: "对局结束。",
      sub: "复盘看看这局发生了什么。"
    };

    document.getElementById("reviewTitle").textContent = isWin ? "她是怎么一步步交出验证码的" : "骗局没得手，正好看看防线";

    var totalTalk = game.counts.lure + game.counts.pressure + game.counts.rapport + (game.counts.none || 0);
    var rows = [
      { key: "lure", label: "利诱", color: "#d99a2b" },
      { key: "pressure", label: "施压", color: "#c4553f" },
      { key: "rapport", label: "套近乎", color: "#33746e" }
    ];
    if ((game.counts.challenge || 0) > 0){
      rows.push({ key: "challenge", label: "回应质疑", color: "#8a8173" });
    }
    if ((game.counts.none || 0) > 0){
      rows.push({ key: "none", label: "无明确话术", color: "#8a8173" });
    }
    if (game.counts.code > 0){
      rows.push({ key: "code", label: sc.code.title, color: "#2b3038" });
    }
    var maxCount = 1;
    rows.forEach(function(r){ maxCount = Math.max(maxCount, game.counts[r.key] || 0); });

    var countsHtml = "";
    rows.forEach(function(r){
      var count = game.counts[r.key] || 0;
      var width = count > 0 ? Math.max(8, Math.round(count / maxCount * 100)) : 0;
      countsHtml += '<div class="count-row">' +
        '<div class="count-label' + (count === 0 ? " dim" : "") + '">' + r.label + '</div>' +
        '<div class="count-bar"><div class="count-fill" style="width:' + width + '%;background:' + r.color + '"></div></div>' +
        '<div class="count-val' + (count === 0 ? " dim" : "") + '">' + (count === 0 ? "未使用" : "× " + count) + '</div>' +
      '</div>';
    });

    var signalText = pickSignal(game);
    var signalComment = isWin
      ? "——这已经是识破信号。她划出了底线，但一步步的铺垫让这条线被挪走了。"
      : "——这句话就是识破信号。她守住了底线，没有顺着你的话术走。";

    var body = '' +
      '<div class="review-card">' +
        '<div class="sec-label"><span class="sec-num">01</span>对局结果</div>' +
        '<div class="result-stamp-row"><span class="stamp ' + result.cls + '">' + result.stamp + '</span></div>' +
        '<p class="result-line">' + escapeHtml(result.line) + '</p>' +
        '<p class="result-sub">' + escapeHtml(result.sub) + '</p>' +
      '</div>' +
      '<div class="review-card">' +
        '<div class="sec-label"><span class="sec-num">02</span>本局套路清单</div>' +
        '<p class="meta-line">共 ' + totalTalk + ' 次话术 · ' + Math.min(game.round, MAX_ROUNDS) + ' 个回合 · 最终信任值 ' + game.trust + '</p>' +
        countsHtml +
      '</div>' +
      '<div class="review-card">' +
        '<div class="sec-label"><span class="sec-num">03</span>防线分析</div>' +
        '<div class="defense">' +
          '<div class="d-num">1</div>' +
          '<div><div class="d-title">最危险的一步</div><p class="d-text">' + escapeHtml(buildDanger(game)) + '</p></div>' +
        '</div>' +
        '<div class="defense">' +
          '<div class="d-num">2</div>' +
          '<div><div class="d-title">识破信号</div><p class="d-text">小林说过：「' + escapeHtml(signalText) + '」' + escapeHtml(signalComment) + '</p></div>' +
        '</div>' +
        '<div class="defense">' +
          '<div class="d-num">3</div>' +
          '<div><div class="d-title">现实中的正确做法</div><p class="d-text">' + sc.review.defense3 + '</p></div>' +
        '</div>' +
      '</div>';

    document.getElementById("reviewBody").innerHTML = body;
  }

  /* ---------- 事件 ---------- */
  document.addEventListener("click", function(e){
    var target = e.target.closest ? e.target.closest("[data-action]") : null;
    if (!target) return;
    var action = target.getAttribute("data-action");
    if (action === "start"){ startGame("choice", selectedScenario); }
    else if (action === "start-free"){ startGame("free"); }
    else if (action === "scenario"){ selectScenario(target.getAttribute("data-scenario")); }
    else if (action === "again"){
      if (!current.game) startGame("choice", selectedScenario);
      else startGame(current.game.mode, current.game.scenario);
    }
    else if (action === "home"){ goHome(); }
    else if (action === "exit"){ exitGame(); }
    else if (action === "exit-confirm"){ doExit(); }
    else if (action === "exit-cancel"){ hideExitModal(); }
    else if (action === "mask"){ if (target.id === "exitModal") hideExitModal(); }
    else if (action === "choose"){ chooseOption(parseInt(target.getAttribute("data-i"), 10)); }
    else if (action === "continue"){ continueGame(); }
    else if (action === "key"){ requestCode(); }
    else if (action === "review"){ goReview(); }
    else if (action === "send"){ sendFreeMessage(); }
  });

  document.addEventListener("input", function(e){
    if (e.target && e.target.id === "freeText"){
      var counter = document.getElementById("freeCount");
      if (counter) counter.textContent = e.target.value.length + " / 200";
    }
  });

  document.addEventListener("keydown", function(e){
    if (e.target && e.target.id === "freeText" && e.key === "Enter" && !e.shiftKey && !e.isComposing){
      e.preventDefault();
      sendFreeMessage();
    }
  });

  /* ---------- 启动 ---------- */
  function boot(){
    var saved = loadSave();
    if (saved && saved.game){
      current = saved;
      if (current.screen === "review" && current.game.status === "playing"){
        current.screen = "game";
      }
      if (current.screen !== "game" && current.screen !== "review"){
        current.screen = "game";
      }
      switchScreen(current.screen);
    } else {
      current = { screen: "home", game: null };
      switchScreen("home");
    }
  }

  boot();
})();
</script>
</body>
</html>
